name: BSL generated parser drift

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  verify-generated-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed semantic parser
        run: python tools/generate_bsl_semantic_parser.py --check
