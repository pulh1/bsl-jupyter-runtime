name: Publish Python packages to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/jupyter/frontend/package-lock.json
            packages/vscode/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"

      - name: Verify release commit is on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          projects = (
              Path('pyproject.toml'),
              Path('packages/jupyter/pyproject.toml'),
          )
          versions = {
              str(path): tomllib.loads(path.read_text(encoding='utf-8'))['project']['version']
              for path in projects
          }
          versions['packages/jupyter/frontend/package.json'] = json.loads(
              Path('packages/jupyter/frontend/package.json').read_text(encoding='utf-8')
          )['version']
          if len(set(versions.values())) != 1:
              raise SystemExit(f'Package versions differ: {versions}')
          version = next(iter(versions.values()))
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f"Release tag {os.environ['RELEASE_TAG']} does not match v{version}")
          PY

      - name: Install Jupyter frontend dependencies
        run: npm ci --prefix packages/jupyter/frontend

      - name: Install VS Code extension dependencies
        run: npm ci --prefix packages/vscode

      - name: Test and compile VS Code extension
        run: |
          npm --prefix packages/vscode run test:unit
          npm --prefix packages/vscode run compile

      - name: Test package contents and dependencies
        run: >-
          uvx --from "pytest>=8,<9" pytest -q tests/packaging/test_product_wheels.py
          -k "jupyter_release_build_produces_one_core_dependent_wheel or
          jupyter_wheel_ships_discoverable_highlighting_and_licenses"

      - name: Verify packaged 1C extension matches source
        env:
          PYTHONPATH: src
        run: >-
          uvx --from "pytest>=8,<9" pytest -q
          tests/unit/test_universal_extension_source.py::test_checked_in_bundle_matches_canonical_source_and_manifest

      - name: Build wheels and source distributions
        run: |
          uv build --package onec-interactive-runtime-core --no-sources --out-dir dist
          uv build --package onec-interactive-jupyter --no-sources --out-dir dist

      - name: Verify release artifacts
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from zipfile import ZipFile

          projects = (
              Path('pyproject.toml'),
              Path('packages/jupyter/pyproject.toml'),
          )
          expected = set()
          for project in projects:
              metadata = tomllib.loads(project.read_text(encoding='utf-8'))['project']
              prefix = metadata['name'].replace('-', '_') + '-' + metadata['version']
              wheels = list(Path('dist').glob(prefix + '-*.whl'))
              if len(wheels) != 1:
                  raise SystemExit(f'Expected one wheel for {prefix}, found: {wheels}')
              expected.update((wheels[0].name, prefix + '.tar.gz'))
          # uv creates a .gitignore in a new output directory.
          actual = {
              path.name for path in Path('dist').iterdir()
              if path.is_file() and path.name != '.gitignore'
          }
          if actual != expected:
              raise SystemExit(f'Release artifacts differ: expected {expected}, found {actual}')
          core_wheel = next(Path('dist').glob('onec_interactive_runtime_core-*.whl'))
          with ZipFile(core_wheel) as archive:
              for filename in ('OnecInteractiveRuntime.cfe', 'extension-manifest.json'):
                  resource = f'onec_runtime/resources/extension/{filename}'
                  if archive.read(resource) != (Path('src') / resource).read_bytes():
                      raise SystemExit(f'Core wheel has a stale extension resource: {resource}')
          PY

      - name: Build VS Code extension
        run: |
          VSCODE_VERSION="$(node -p "require('./packages/vscode/package.json').version")"
          npm --prefix packages/vscode run package -- \
            --out "$GITHUB_WORKSPACE/dist/bsl-notebook-${VSCODE_VERSION}.vsix"

      - name: Assemble complete GitHub release bundle
        run: >-
          python tools/prepare_release_assets.py
          --dist dist
          --extension-root src/onec_runtime/resources/extension

      - uses: actions/upload-artifact@v4
        with:
          name: core-distributions
          path: |
            dist/onec_interactive_runtime_core-*.whl
            dist/onec_interactive_runtime_core-*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: jupyter-distributions
          path: |
            dist/onec_interactive_jupyter-*.whl
            dist/onec_interactive_jupyter-*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/onec_interactive_runtime_core-*.whl
            dist/onec_interactive_runtime_core-*.tar.gz
            dist/onec_interactive_jupyter-*.whl
            dist/onec_interactive_jupyter-*.tar.gz
            dist/OnecInteractiveRuntime.cfe
            dist/extension-manifest.json
            dist/bsl-notebook-*.vsix
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-core:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-jupyter:
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    environment: pypi-jupyter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jupyter-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  upload-release-assets:
    needs: [build, publish-core, publish-jupyter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Upload complete bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
